publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  flutter_webrtc: ^0.9.48
  permission_handler: ^11.3.0
  flutter_contacts: ^1.1.9
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  video_player: ^2.8.6
  record: ^5.0.4
