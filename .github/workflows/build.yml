name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache:  false

      - run: flutter doctor -v
      - run: flutter pub get
      - name: Fix AndroidX
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g\n" > android/gradle.properties
      - run: flutter build apk --release --verbose
      - run: find android/app/build -name "*.apk""

      - uses: actions/upload-artifact@v4
        with:
          name: hamza-jani-apk
          path: `android/app/build/outputs/apk/release/app-release.apk`
