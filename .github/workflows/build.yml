name: Build Hamza Jani Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Firestore security rules in Emulator
        working-directory: tools/firestore_rules_tests
        run: |
          node --check ../firestore_uid_migration/migrate_firestore_uids.js
          node --check firestore_rules.test.js
          npm install --no-audit --no-fund
          npm test

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Searching for pubspec.yaml:"
          find . -maxdepth 4 -name pubspec.yaml

      - name: Prepare Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in repository root."
            exit 1
          fi
          flutter create --platforms=android .

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache"
          gradle_files = sorted(
              set(cache.glob("**/android/build.gradle"))
              | set(cache.glob("**/android/build.gradle.kts"))
          )

          def patch_compile_sdk(text):
              # Groovy: compileSdk 33 / compileSdkVersion 33
              # Groovy/Kotlin DSL: compileSdk = 33
              # Also accept the parenthesized compileSdkVersion(33) form.
              text = re.sub(
                  r'(?m)^(\s*compileSdkVersion)\s*(?:=\s*)?\(?\s*33\s*\)?\s*$',
                  r'\1 36',
                  text,
              )
              text = re.sub(
                  r'(?m)^(\s*compileSdk)\s*=\s*33\s*$',
                  r'\1 = 36',
                  text,
              )
              text = re.sub(
                  r'(?m)^(\s*compileSdk)\s+33\s*$',
                  r'\1 36',
                  text,
              )
              return text

          changed = []
          for gradle_file in gradle_files:
              original = gradle_file.read_text()
              updated = patch_compile_sdk(original)
              if updated != original:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))

          print(f"Updated {len(changed)} Android plugin Gradle files to compile SDK 36.")
          for path in changed:
              print(path)

          firebase_auth_files = sorted(
              set(cache.glob("**/firebase_auth-*/android/build.gradle"))
              | set(cache.glob("**/firebase_auth-*/android/build.gradle.kts"))
          )
          if not firebase_auth_files:
              raise SystemExit("ERROR: firebase_auth Android Gradle file was not found.")

          for path in firebase_auth_files:
              content = path.read_text()
              print(f"===== firebase_auth Gradle file after patch: {path} =====")
              print(content)
              if re.search(
                  r'(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?(?:\(\s*)?33\b',
                  content,
              ):
                  raise SystemExit(
                      f"ERROR: firebase_auth still contains compileSdk 33: {path}"
                  )

          print("Verified: firebase_auth no longer contains compileSdk 33; proceeding to APK build.")
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hamza-Jani-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Jani-Android-APK
          path: dist/Hamza-Jani-release.apk
          if-no-files-found: error
          retention-days: 14
