name: Build Hamza Jani

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Project
        run: |
          flutter create --project-name hamza_jani --org com.example --platforms android .
          echo "=== google-services.json check ==="
          ls -lh google-services.json
          cp google-services.json android/app/google-services.json
          ls -lh android/app/google-services.json

      - name: Setup Firebase
        run: |
          python3 << 'PYEOF'
          import pathlib

          # 1. settings.gradle
          p = pathlib.Path("android/settings.gradle")
          t = p.read_text()
          if "google-services" not in t:
              t = t.replace(
                  'id "com.android.application"',
                  'id "com.android.application"'
              )
              # Add plugin in plugins block
              if 'id "com.google.gms.google-services"' not in t:
                  t = t.replace(
                      'id "org.jetbrains.kotlin.android"',
                      'id "org.jetbrains.kotlin.android"\n    id "com.google.gms.google-services" version "4.4.2" apply false'
                  )
              p.write_text(t)
              print("settings.gradle FIXED")
          else:
              print("settings.gradle already has google-services")

          # 2. app/build.gradle
          p2 = pathlib.Path("android/app/build.gradle")
          t2 = p2.read_text()
          if "google-services" not in t2:
              t2 = t2.replace(
                  'id "dev.flutter.flutter-gradle-plugin"',
                  'id "dev.flutter.flutter-gradle-plugin"\n    id "com.google.gms.google-services"'
              )
              p2.write_text(t2)
              print("app/build.gradle FIXED")
          else:
              print("app/build.gradle already has google-services")

          print("--- settings.gradle ---")
          print(pathlib.Path("android/settings.gradle").read_text())
          print("--- app/build.gradle ---")
          print(pathlib.Path("android/app/build.gradle").read_text())
          PYEOF

      - name: Add Permissions
        run: |
          python3 << 'PYEOF'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          if "RECORD_AUDIO" not in t:
              t = t.replace("<application", '<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <application')
              p.write_text(t)
              print("Permissions added")
          else:
              print("Permissions already there")
          PYEOF

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamza-jani-apk
          path: build/app/outputs/flutter-apk/app-release.apk
