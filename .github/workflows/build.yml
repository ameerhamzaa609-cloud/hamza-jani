
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: false

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Configure AndroidX
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g\n" > android/gradle.properties

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Diagnose APK output
        if: always()
        run: |
          echo "Searching entire project for APK files"
          find . -type f -name "*.apk" -print
          echo "Checking Flutter output"
          ls -R build/app/outputs || true
          echo "Checking Android output"
          ls -R android/app/build/outputs || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hamza-jani-apk
          path: |
            build/app/outputs/**/*.apk
            android/app/build/outputs/**/*.apk
          if-no-files-found: warn
