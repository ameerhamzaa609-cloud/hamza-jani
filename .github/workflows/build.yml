
name: Build MyFirstApp Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Prepare Gradle
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --stacktrace

      - name: Find and Prepare APK
        run: |
          mkdir -p dist

          APK=$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK file was generated."
            echo "Searching all project folders:"
            find . -type f -name "*.apk"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" dist/MyFirstApp-release.apk

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-Android-APK
          path: dist/MyFirstApp-release.apk
          if-no-files-found: error
          retention-days: 14
