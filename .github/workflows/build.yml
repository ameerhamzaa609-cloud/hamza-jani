
name: Build MyFirstApp Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Searching for pubspec.yaml:"
          find . -maxdepth 4 -name pubspec.yaml

      - name: Prepare Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in repository root."
            exit 1
          fi

          flutter create --platforms=android .

      - name: Set Android library compile SDK
        run: |
          # Flutter 3.50 generates Android library projects with compileSdk 33.
          # Raise every Android library module after Flutter has generated its Gradle files.
          cat >> android/build.gradle <<'GRADLE'

          subprojects {
              afterEvaluate {
                  def androidExtension = extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdk = 36
                  }
              }
          }
          GRADLE

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/MyFirstApp-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyFirstApp-Android-APK
          path: dist/MyFirstApp-release.apk
          if-no-files-found: error
          retention-days: 14
