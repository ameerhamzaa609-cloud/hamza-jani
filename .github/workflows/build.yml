name: Build Hamza Jani Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Project Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Searching for pubspec.yaml:"
          find . -maxdepth 4 -name pubspec.yaml

      - name: Prepare Flutter Project
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: pubspec.yaml not found in repository root."
            exit 1
          fi
          flutter create --platforms=android .

      - name: Install Dependencies
        run: flutter pub get

      - name: Set Android plugin compile SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache"
          changed = []
          gradle_files = list(cache.glob("**/android/build.gradle")) + list(cache.glob("**/android/build.gradle.kts"))
          for gradle_file in gradle_files:
              original = gradle_file.read_text()
              updated = original
              # FlutterFire plugins may use a Flutter variable or safeExtGet(...)
              # instead of a numeric compileSdk. Replace the whole active setting.
              updated = re.sub(
                  r'(?m)^(\s*)compileSdkVersion\b[^\n]*
          for path in changed:
              print(path)
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hamza-Jani-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Jani-Android-APK
          path: dist/Hamza-Jani-release.apk
          if-no-files-found: error
          retention-days: 14
,
                  r'\g<1>compileSdkVersion 36',
                  updated
              )
              updated = re.sub(
                  r'(?m)^(\s*)compileSdk\s*=\s*[^\n]+
          for path in changed:
              print(path)
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hamza-Jani-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Jani-Android-APK
          path: dist/Hamza-Jani-release.apk
          if-no-files-found: error
          retention-days: 14
,
                  r'\g<1>compileSdk = 36',
                  updated
              )
              updated = re.sub(
                  r'(?m)^(\s*)compileSdkVersion\s*\([^\n]*\)\s*
          for path in changed:
              print(path)
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hamza-Jani-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Jani-Android-APK
          path: dist/Hamza-Jani-release.apk
          if-no-files-found: error
          retention-days: 14
,
                  r'\g<1>compileSdkVersion(36)',
                  updated
              )
              if updated != original:
                  gradle_file.write_text(updated)
                  changed.append(str(gradle_file))
          print(f"Updated {len(changed)} Android plugin Gradle files to compile SDK 36.")
          for path in changed:
              print(path)
          firebase_auth_files = list(cache.glob("**/firebase_auth-*/android/build.gradle")) + list(cache.glob("**/firebase_auth-*/android/build.gradle.kts"))
          for path in firebase_auth_files:
              print(f"firebase_auth Gradle file: {path}")
              print(path.read_text())
          for path in changed:
              print(path)
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk"
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Hamza-Jani-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamza-Jani-Android-APK
          path: dist/Hamza-Jani-release.apk
          if-no-files-found: error
          retention-days: 14
